name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - install, lint, test, build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Static analysis (ESLint + security plugin)
        run: npm run lint
      - name: Run backend tests with coverage
        run: npm run test:coverage
      - name: Dependency audit (production, fails on high or critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Build check (application loads without errors)
        run: node -e "process.env.NODE_ENV='test';process.env.JWT_SECRET='ci';process.env.MONGODB_URI='mongodb://localhost/ci';require('./src/app');console.log('Backend build check passed')"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore

  frontend:
    name: Frontend - install, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Static analysis (ESLint + security plugin)
        run: npm run lint
      - name: Run frontend tests with coverage
        run: npm run test:coverage
      - name: Dependency audit (production, fails on high or critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  static-analysis-report:
    name: Static analysis report (evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run ESLint in both projects and keep the JSON results
        run: |
          mkdir -p reports
          (cd backend && npm ci && npx eslint . -f json -o ../reports/eslint-backend.json) || echo "backend findings recorded"
          (cd frontend && npm ci && npx eslint . -f json -o ../reports/eslint-frontend.json) || echo "frontend findings recorded"
      - name: Summarise findings
        run: |
          node -e "
          const fs=require('fs');
          let out='## Static analysis (ESLint + eslint-plugin-security)\n\n| Project | Files | Errors | Warnings |\n|---|---|---|---|\n';
          for (const p of ['backend','frontend']) {
            const r=JSON.parse(fs.readFileSync('reports/eslint-'+p+'.json','utf8'));
            const e=r.reduce((n,f)=>n+f.errorCount,0), w=r.reduce((n,f)=>n+f.warningCount,0);
            out+='| '+p+' | '+r.length+' | '+e+' | '+w+' |\n';
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,out);
          console.log(out);"
      - uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: reports

  docker:
    name: Docker - build images and run the full stack
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Create a throwaway .env for the CI run
        run: |
          cat > .env <<EOF
          MONGO_ROOT_USER=ci_root
          MONGO_ROOT_PASSWORD=ci_root_password
          APP_DB_USER=ci_app
          APP_DB_PASSWORD=ci_app_password
          JWT_SECRET=$(openssl rand -hex 32)
          CLIENT_ORIGIN=http://localhost:8080
          EOF
      - name: Build images
        run: docker compose build
      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test the API and the frontend
        run: |
          curl --fail --insecure https://localhost:5000/health
          curl --fail http://localhost:8080/ | grep -q 'id="root"'
          curl -sI http://localhost:8080/ | grep -i 'content-security-policy'
      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
