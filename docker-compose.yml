# HustleHub+ full stack: MongoDB + Express API (HTTPS) + React frontend (nginx).
# Start:  cp .env.docker.example .env   (edit the values)   then   docker compose up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
    # No "ports": the database is only reachable from other containers, never from the host.

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${APP_DB_USER}:${APP_DB_PASSWORD}@mongo:27017/hustlehub?authSource=hustlehub
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      JWT_EXPIRES_IN: 1h
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      LOG_DIR: /app/logs
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-HustleHub+ <no-reply@hustlehub.local>}
    ports:
      - "5000:5000"
    volumes:
      - backend_logs:/app/logs
      - backend_certs:/app/certificates
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://localhost:5000/api}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_ORIGIN: ${API_ORIGIN:-https://localhost:5000}
    ports:
      - "8080:8080"
    networks:
      - internal

volumes:
  mongo_data:
  backend_logs:
  backend_certs:

networks:
  internal:
